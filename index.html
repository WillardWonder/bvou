<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YOU University · Mental Game Lab · Merrill Bluejays Wrestling</title>
<meta name="description" content="Interactive mental-performance training for Merrill Bluejays Wrestling, built as a companion to Winning State Wrestling.">
<meta name="theme-color" content="#06111f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#06111f;--navy2:#0d1d33;--navy3:#15294a;--blue:#0866e8;--blue2:#3b8bff;--red:#ff2147;--ink:#eaf1fb;--mute:#93a6c2;--line:#243a5c;--ok:#22c58b;--warn:#ffb020;--r:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--navy);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--blue2)}button{font:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:rgba(6,17,31,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
header.top img{height:30px}header.top b{font-weight:900;letter-spacing:.06em;font-size:13px}header.top span{color:var(--blue2);font-weight:800;font-size:12px;letter-spacing:.1em}
header.top .sp{flex:1}.pill{background:var(--navy3);border:1px solid var(--line);border-radius:30px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--mute)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(6,17,31,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;max-width:120px;text-align:center;text-decoration:none;color:var(--mute);font-size:11px;font-weight:700;padding:4px 0;border-radius:10px}
nav.tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px}nav.tabs a.on{color:#fff;background:var(--navy3)}
nav.tabs .dot{display:inline-block;min-width:16px;padding:0 4px;height:16px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;line-height:16px;margin-left:2px}
h1{font-size:34px;line-height:1.02;letter-spacing:-.02em;margin:18px 0 6px;font-weight:900}h2{font-size:24px;margin:22px 0 8px;font-weight:900;letter-spacing:-.01em}h3{font-size:16px;margin:16px 0 6px}
.kick{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--blue2);text-transform:uppercase}.hook{font-size:17px;font-weight:600;color:#cfe0ff;margin:0 0 10px}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.moment{background:linear-gradient(135deg,#0c2040,#12264a);border-color:#2b4c80}.card.red{border-color:#7a2235;background:#1a0f1a}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;border-radius:20px;padding:3px 9px;margin-bottom:6px}
.b-book{background:#fff;color:var(--navy)}.b-sci{background:#0a7d55;color:#fff}.b-mer{background:var(--blue);color:#fff}.b-you{border:1.5px solid var(--red);color:#ff6b84}
.src{font-size:11px;color:var(--mute);font-weight:700;cursor:help;border-bottom:1px dotted var(--mute)}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;background:#0a1628;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
textarea{min-height:76px;resize:vertical}textarea:focus,input:focus{outline:2px solid var(--blue);border-color:transparent}
label.l{display:block;font-weight:700;font-size:13.5px;margin:12px 0 5px;color:#d6e4fb}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:800;font-size:15px}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.btn.red{background:var(--red)}.btn.sm{padding:7px 11px;font-size:13px}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.u{display:block;text-decoration:none;color:inherit;background:var(--navy2);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.u .n{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:900;align-items:center;justify-content:center;margin-right:8px}
.u b{font-size:17px}.u i{display:block;font-style:normal;color:var(--mute);font-size:13px;margin-top:6px}
.ladder{display:flex;gap:4px;margin-top:10px}.ladder span{flex:1;height:6px;border-radius:4px;background:#1f3456}.ladder span.on{background:var(--ok)}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px}.subtabs button{background:var(--navy2);border:1px solid var(--line);color:var(--mute);border-radius:30px;padding:8px 14px;font-weight:800;font-size:13px;white-space:nowrap}.subtabs button.on{background:#fff;color:var(--navy)}
.reveal{display:none}.reveal.show{display:block;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
table.t{width:100%;border-collapse:collapse}table.t th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:6px}table.t td{padding:4px}
input[type=range]{width:100%;accent-color:var(--blue)}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px;padding:8px 4px;border-bottom:1px solid var(--line)}.bars .b{flex:1;display:flex;gap:3px;align-items:flex-end;height:100%}.bars .b div{flex:1;border-radius:4px 4px 0 0;transition:height .3s}.bars .gapmax{outline:2px dashed var(--warn);outline-offset:3px;border-radius:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.dial{position:relative;height:28px;border-radius:20px;background:linear-gradient(90deg,#4f7fc4 0 30%,var(--blue) 30% 70%,var(--red) 70%);margin:8px 0}
.mk{position:absolute;top:-6px;width:4px;height:40px;background:#fff;border-radius:2px;transform:translateX(-2px)}.mk.best{background:var(--warn)}
.sort{display:grid;gap:8px}.chipq{background:#0a1628;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.chipq q{flex:1 1 200px;font-weight:700;quotes:none}.chipq.right{border-color:var(--ok)}.chipq.wrong{border-color:var(--red)}
.chipq button{background:var(--navy3);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}
.pacer{display:flex;flex-direction:column;align-items:center;padding:20px 0}
.ring{width:240px;height:240px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#123a73 0,#0a1628 70%);border:3px solid var(--blue);transition:transform 4s linear, border-color .3s}
.ring b{font-size:30px;font-weight:900}.ring i{font-style:normal;color:#cfe0ff;font-size:15px;font-weight:700;letter-spacing:.12em}.ring .cnt{font-size:44px;font-weight:900;color:#fff;margin-top:4px}
.flash{border-radius:var(--r);padding:22px;text-align:center;background:#0a1628;border:1px solid var(--line);min-height:170px;display:flex;flex-direction:column;justify-content:center}
.flash .q{font-size:19px;font-weight:800}.flash .a{color:#bfe8d6;font-size:16px;margin-top:10px}
.big{font-size:28px;font-weight:900;line-height:1.15}
.stage{position:fixed;inset:0;background:var(--navy);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}.stage.show{display:flex}
.stage .lab{font-size:13px;letter-spacing:.2em;font-weight:900;color:var(--blue2)}.stage .txt{font-size:clamp(24px,6vw,44px);font-weight:900;max-width:760px;margin:12px 0}.stage .bar{width:min(500px,80vw);height:6px;background:#1f3456;border-radius:6px;overflow:hidden;margin-top:18px}.stage .bar div{height:100%;background:var(--red);width:0}
.list .it{border-top:1px solid var(--line);padding:10px 0}.list .it:first-child{border-top:0}.muted{color:var(--mute)}.small{font-size:13px}
.dot[hidden]{display:none!important}.stats{grid-template-columns:repeat(3,1fr)!important}.stats .stat b{font-size:20px}.hero>*{position:relative;z-index:1}.hero img{z-index:0!important}@media(max-width:480px){.hero img{width:130px;opacity:.55}}
.gate{max-width:460px;margin:40px auto;text-align:center}.gate img{width:150px}.gbtn{display:inline-flex;gap:10px;align-items:center;background:#fff;color:#1f1f1f;border:0;border-radius:30px;padding:12px 20px;font-weight:800;font-size:16px}.sync{font-size:11px;color:var(--mute)}
.toast{white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#fff;color:var(--navy);font-weight:800;padding:10px 16px;border-radius:30px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
.hero{margin-top:14px;border-radius:20px;padding:22px;background:radial-gradient(circle at 85% 20%,rgba(8,102,232,.55),transparent 55%),radial-gradient(circle at 0 100%,rgba(255,33,71,.3),transparent 50%),var(--navy2);border:1px solid var(--line);position:relative;overflow:hidden}
.hero img{position:absolute;right:-16px;top:-6px;width:170px;opacity:.95}.hero .you{font-size:64px;font-weight:900;line-height:.85;letter-spacing:-.04em}.hero .uni{font-size:22px;font-weight:900;letter-spacing:.1em;color:var(--blue2)}
.stat{background:#0a1628;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--mute)}
.ccard{background:#fff;color:#06111f;border-radius:16px;padding:16px;max-width:420px}.ccard h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}.ccard h3 img{height:26px}.ccard .r{border-bottom:1px solid #c9d5e4;padding:7px 0;display:flex;gap:10px}.ccard .r b{width:92px;flex:none;color:#0866e8;font-size:12px;letter-spacing:.08em}
@media print{body{background:#fff;color:#000}header.top,nav.tabs,.noprint,.toast{display:none!important}.wrap{padding:0}.card{border:0;background:#fff;color:#000}.ccard{border:2px dashed #888}}
</style>
</head>
<body>
<header class="top"><div class="in"><img src="bluejay.png" alt="Merrill Bluejays"><div><b>MERRILL BLUEJAYS</b><br><span>YOU UNIVERSITY LAB</span></div><div class="sp"></div><span class="pill" id="who" hidden></span><a class="pill" href="#coach" style="text-decoration:none">Coaches</a></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs">
 <a href="#home" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
 <a href="#review" data-t="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>Rewind<span class="dot" id="dueDot" hidden></span></a>
 <a href="#breathe" data-t="breathe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>Breathe</a>
 <a href="#reset" data-t="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Reset</a>
 <a href="#log" data-t="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/></svg>Logs</a>
 <a href="#card" data-t="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 11h10M7 15h6"/></svg>Card</a>
</nav>
<div class="stage" id="stage"><div class="lab" id="stLab"></div><div class="txt" id="stTxt"></div><div class="muted" id="stSub"></div><div class="bar"><div id="stBar"></div></div><div class="row" style="margin-top:24px;justify-content:center"><button class="btn" id="stBtn" hidden>I'm back</button><button class="btn ghost" id="stClose">Close</button></div></div>
<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
